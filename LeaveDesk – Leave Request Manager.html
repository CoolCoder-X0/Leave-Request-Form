<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeaveDesk – Leave Request Manager</title>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--text:#1c2430;--muted:#667085;--border:#e1e5ec;
  --primary:#2457c5;--primary-h:#1b46a3;--ok:#14803c;--ok-bg:#e3f5e9;
  --bad:#b42318;--bad-bg:#fde8e6;--warn:#9a6700;--warn-bg:#fff3d1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b;--surface:#18202b;--text:#e8ecf2;--muted:#98a2b3;--border:#2a3441;
    --primary:#6b95f0;--primary-h:#8aaaf5;--ok:#5fd18a;--ok-bg:#12301f;
    --bad:#ff8d82;--bad-bg:#3a1916;--warn:#f1c453;--warn-bg:#352a0c;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--border)}
.bar{max-width:960px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px}
.brand span{color:var(--primary)}
.tabs{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);padding:7px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--primary);color:#fff}
main{max-width:960px;margin:24px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
h2{margin:0 0 14px;font-size:17px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
textarea{resize:vertical;min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-h)}
.btn.full{width:100%;margin-top:16px}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--bg)}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat b{display:block;font-size:24px}.stat small{color:var(--muted)}
.item{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item .meta{color:var(--muted);font-size:13px}
.item p{margin:8px 0 0}
.note{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pending{background:var(--warn-bg);color:var(--warn)}
.approved{background:var(--ok-bg);color:var(--ok)}
.rejected{background:var(--bad-bg);color:var(--bad)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.actions input{flex:1;min-width:140px;padding:6px 10px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filters button{border:1px solid var(--border);background:none;color:var(--muted);border-radius:99px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hidden{display:none}
.foot{max-width:960px;margin:0 auto 24px;padding:0 20px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">Leave<span>Desk</span></div>
  <div class="tabs" role="tablist">
    <button id="tabEmp" class="on" role="tab">Employee</button>
    <button id="tabMgr" role="tab">Employer</button>
  </div>
</div></header>

<main>
  <!-- Employee view -->
  <section id="emp" class="grid">
    <div class="card">
      <h2>New leave request</h2>
      <label for="name">Your name</label>
      <input id="name" placeholder="e.g. Priya Raman" autocomplete="name">
      <label for="date">Date</label>
      <input type="text" id="date" placeholder="e.g. 5 Nov 2026" autocomplete="off">
      <label for="reason">Reason</label>
      <textarea id="reason" placeholder="Brief reason for your leave"></textarea>
      <div class="err" id="err"></div>
      <button class="btn full" id="submit">Submit request</button>
    </div>
    <div class="card">
      <h2>My requests</h2>
      <div id="mine"></div>
    </div>
  </section>

  <!-- Employer view -->
  <section id="mgr" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px"><h2 style="margin:0">Leave requests</h2><button class="btn sm hidden" id="export">Export to Excel</button></div>
      <div class="filters" id="filters"></div>
      <div id="all"></div>
    </div>
  </section>
</main>
<div class="foot">Demo app: requests are saved in this browser only. Employer view has no login.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  var KEY="leavedesk.requests", NAMEKEY="leavedesk.name";
  var requests=[], filter="all";

  function load(){
    try{var r=localStorage.getItem(KEY);requests=r?JSON.parse(r):[];}catch(e){requests=[];}
    if(!Array.isArray(requests))requests=[];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(requests));}catch(e){}}
  function $(id){return document.getElementById(id);}
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
  function stamp(){return new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});}

  function card(r,manager){
    var h='<div class="item"><div class="top"><div><strong>'+(manager?esc(r.name):'Leave request')+'</strong>'+
      '<div class="meta">Date: '+esc(r.date||(r.from+' to '+r.to))+' · submitted '+esc(r.created)+'</div></div><span class="badge '+r.status+'">'+r.status.charAt(0).toUpperCase()+r.status.slice(1)+'</span></div>'+
      (r.reason?'<p>'+esc(r.reason)+'</p>':'');
    if(r.comment)h+='<div class="note"><strong>Employer note:</strong> '+esc(r.comment)+'</div>';
    if(manager&&r.status==="pending"){
      h+='<div class="actions"><input placeholder="Optional note to employee" data-note="'+r.id+'">'+
        '<button class="btn ok sm" data-act="approved" data-id="'+r.id+'">Approve</button>'+
        '<button class="btn no sm" data-act="rejected" data-id="'+r.id+'">Reject</button></div>';
    }else if(!manager&&r.status==="pending"){
      h+='<div class="actions"><button class="btn ghost sm" data-cancel="'+r.id+'">Cancel request</button></div>';
    }
    return h+'</div>';
  }

  function render(){
    var me=$("name").value.trim().toLowerCase();
    var mine=requests.filter(function(r){return me&&r.name.toLowerCase()===me;});
    $("mine").innerHTML=mine.length?mine.slice().reverse().map(function(r){return card(r,false);}).join("")
      :'<div class="empty">'+(me?'No requests yet.':'Enter your name to see your requests.')+'</div>';

    var c={pending:0,approved:0,rejected:0};
    requests.forEach(function(r){c[r.status]++;});
    $("stats").innerHTML=[["Total",requests.length],["Pending",c.pending],["Approved",c.approved],["Rejected",c.rejected]]
      .map(function(s){return '<div class="stat"><b>'+s[1]+'</b><small>'+s[0]+'</small></div>';}).join("");

    $("filters").innerHTML=["all","pending","approved","rejected"].map(function(f){
      return '<button data-f="'+f+'" class="'+(f===filter?'on':'')+'">'+f.charAt(0).toUpperCase()+f.slice(1)+'</button>';}).join("");
    var list=requests.filter(function(r){return filter==="all"||r.status===filter;}).slice().reverse();
    $("all").innerHTML=list.length?list.map(function(r){return card(r,true);}).join("")
      :'<div class="empty">No requests to show.</div>';
  }

  function show(which){
    $("emp").classList.toggle("hidden",which!=="emp");
    $("mgr").classList.toggle("hidden",which!=="mgr");
    $("tabEmp").classList.toggle("on",which==="emp");
    $("tabMgr").classList.toggle("on",which==="mgr");
    render();
  }

  $("tabEmp").onclick=function(){show("emp");};
  $("tabMgr").onclick=function(){show("mgr");};

  try{$("name").value=localStorage.getItem(NAMEKEY)||"";}catch(e){}
  $("name").addEventListener("input",function(){try{localStorage.setItem(NAMEKEY,$("name").value);}catch(e){}render();});

  $("submit").onclick=function(){
    var n=$("name").value.trim(),d=$("date").value.trim(),rs=$("reason").value.trim();
    var err=$("err");err.textContent="";
    if(!n)return err.textContent="Please enter your name.";
    if(!d)return err.textContent="Please type the date.";
    if(!rs)return err.textContent="Please add a short reason.";
    requests.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,
      date:d,reason:rs,status:"pending",comment:"",created:stamp()});
    save();
    $("date").value="";$("reason").value="";
    render();
  };

  document.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.f){filter=b.dataset.f;render();}
    else if(b.dataset.act){
      var r=requests.find(function(x){return x.id===b.dataset.id;});
      var inp=document.querySelector('[data-note="'+b.dataset.id+'"]');
      if(r){r.status=b.dataset.act;r.comment=inp?inp.value.trim():"";save();render();}
    }else if(b.dataset.cancel){
      requests=requests.filter(function(x){return x.id!==b.dataset.cancel;});save();render();
    }
  });

  var dl=null;
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(d){dl=d;if(d)$("export").classList.remove("hidden");}).catch(function(){});
  }
  $("export").onclick=function(){
    var btn=$("export");
    if(!dl||typeof XLSX==="undefined")return;
    if(!requests.length){btn.textContent="No data to export";setTimeout(function(){btn.textContent="Export to Excel";},2000);return;}
    var rows=requests.map(function(r,i){
      return {"No.":i+1,"Employee name":r.name,"Date":r.date||((r.from||"")+" to "+(r.to||"")),"Reason":r.reason,
        "Status":r.status.charAt(0).toUpperCase()+r.status.slice(1),"Employer note":r.comment||"","Submitted":r.created};
    });
    var ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=[{wch:5},{wch:22},{wch:20},{wch:40},{wch:11},{wch:30},{wch:14}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Leave requests");
    var buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    dl.save({filename:"leave-requests.xlsx",data:buf}).catch(function(){});
  };

  load();render();
})();
</script>
</body>
</html>
